<style>
html,body{margin:0;height:100%;background:#1b1d22;overflow:hidden;font-family:sans-serif}

<script>
// ================= buildBedroom (copy ไปใช้ในโปรเจกต์ได้) =================
// <- แก้ข้อมูลตรงนี้ (บรรทัดแรกจะเป็นตัวใหญ่)
const INFO = [["ชื่อ","ณัฏฐพัชร จองวรรณศิริ"],["รหัส","6721651327"],["คณะ","ศิลปศาสตร์และวิทยาศาสตร์"],["สาขา","วิทยาการคอมพิวเตอร์"],["มหาวิทยาลัย","เกษตรศาสตร์ กำแพงแสน"]];
const FONT = "Sarabun, Tahoma, 'Noto Sans Thai', sans-serif";
function drawInfo(w,h,fg,bg){            // ใช้วาดทั้งสี (map) และ height map
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const g=cv.getContext("2d"); g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.fillStyle=fg; g.textAlign="center"; g.textBaseline="middle";
  const ys=[h*0.2,h*0.42,h*0.58,h*0.74,h*0.9];
  INFO.forEach((t,i)=>{ g.font=(i==0?"bold 100px ":"72px ")+FONT; g.fillText(t[0]+" : "+t[1],w/2,ys[i]); });
  return new THREE.CanvasTexture(cv);
}
function drawScreen(){
  const cv=document.createElement("canvas"); cv.width=1024; cv.height=553; const g=cv.getContext("2d");
  const gr=g.createLinearGradient(0,0,1024,553); gr.addColorStop(0,"#1f3b63"); gr.addColorStop(1,"#6a3d8f");
  g.fillStyle=gr; g.fillRect(0,0,1024,553); g.fillStyle="#fff"; g.textAlign="center"; g.textBaseline="middle";
  g.font="bold 70px "+FONT; g.fillText("Interactive 3D Portfolio",512,170);
  g.font="52px "+FONT; g.fillText(INFO[0][1],512,290); g.fillText(INFO[3][1],512,370); g.fillText(INFO[4][1],512,440);
  return new THREE.CanvasTexture(cv);
}
let photoMesh;
function loadPhoto(url){
  new THREE.TextureLoader().load(url, t=>{ photoMesh.material = new THREE.MeshStandardMaterial({map:t}); });
}
const uTime={value:0};
// Cel shading: แบ่งแสงเป็น 3 ระดับ + เส้นขอบ (inverted hull)
function toonMesh(geo,color,name){
  const m=new THREE.Mesh(geo,new THREE.ShaderMaterial({
    uniforms:{uColor:{value:new THREE.Color(color)},uLight:{value:new THREE.Vector3(5,6,6).normalize()},uHL:{value:0}},
    vertexShader:`varying vec3 vN;void main(){vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform vec3 uColor;uniform vec3 uLight;uniform float uHL;varying vec3 vN;
      void main(){float d=dot(normalize(vN),uLight);float b=d>0.5?1.0:(d>0.0?0.7:0.45);
      gl_FragColor=vec4(uColor*b+uHL*vec3(0.25,0.25,0.1),1.);}`}));
  const o=new THREE.Mesh(geo,new THREE.ShaderMaterial({side:THREE.BackSide,
    vertexShader:`void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*0.012,1.);}`,
    fragmentShader:`void main(){gl_FragColor=vec4(0.05,0.03,0.03,1.);}`}));
  o.raycast=()=>{}; m.add(o); m.name=name; m.castShadow=true; return m;
}
function buildBedroom(){
  const root = new THREE.Group(); root.name = "bedroom";
  const mat = c => new THREE.MeshStandardMaterial({color:c, roughness:0.8, metalness:0.05});
  function box(w,h,d,c,x,y,z,name,parent=root){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
    m.position.set(x,y,z); m.name = name||"box"; m.castShadow = m.receiveShadow = true;
    parent.add(m); return m;
  }
  function group(name,x,y,z,ry=0){ const g=new THREE.Group(); g.name=name; g.position.set(x,y,z); g.rotation.y=ry; root.add(g); return g; }
  const S=8, H=3, h=S/2;

  // --- ห้อง: ผนังหันหน้าเข้าด้านใน (มองจากนอกห้องจะโปร่ง) ---
  const plane=(w,hh,c,pos,rot,name)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,hh),mat(c));
    m.position.set(...pos); m.rotation.set(...rot); m.name=name; m.receiveShadow=true; root.add(m); return m; };
  plane(S,S,0xb9926a,[0,0,0],[-Math.PI/2,0,0],"floor");
  plane(S,H,0xe8e2d6,[0,H/2,-h],[0,0,0],"wallBack");
  plane(S,H,0xe8e2d6,[0,H/2,h],[0,Math.PI,0],"wallFront");
  plane(S,H,0xdcd6ca,[-h,H/2,0],[0,Math.PI/2,0],"wallLeft");
  plane(S,H,0xdcd6ca,[h,H/2,0],[0,-Math.PI/2,0],"wallRight");

  // --- เตียง (หัวเตียงชิดผนังหลัง) ---
  const bed = group("bed",0,0,-2.9);
  box(2.2,0.4,2.2,0x6b4a2f,0,0.2,0,"bedFrame",bed);
  box(2.0,0.25,2.1,0xf2f2f2,0,0.52,0,"mattress",bed);
  box(2.0,0.08,1.4,0x4a6fa5,0,0.69,0.35,"blanket",bed);
  box(0.8,0.15,0.4,0xffffff,-0.5,0.72,-0.8,"pillow1",bed);
  box(0.8,0.15,0.4,0xffffff,0.5,0.72,-0.8,"pillow2",bed);
  box(2.3,1.2,0.1,0x6b4a2f,0,0.8,-1.1,"headboard",bed);

  // --- กรอบข้อความบนผนังหัวเตียง ---
  const nf = group("nameFrame",0,2.15,-h+0.04);
  box(2.3,1.1,0.05,0x2b2b2b,0,0,0,"nameFrameBorder",nf);
  // ตัวอักษรนูน: displacementMap (ขยับ vertex จริง) + bumpMap (ให้เงา) จาก height map เดียวกัน
  const hm=drawInfo(1680,720,"#fff","#000");
  const nt=new THREE.Mesh(new THREE.PlaneGeometry(2.1,0.9,300,130),new THREE.MeshStandardMaterial({
    map:drawInfo(1680,720,"#222","#faf7f0"),displacementMap:hm,displacementScale:0.03,bumpMap:hm,bumpScale:3,roughness:0.6}));
  nt.position.z=0.03; nt.name="nameText"; nt.castShadow=true; nf.add(nt);

  // --- ตู้ข้างเตียง + โคมไฟ ---
  [-1.65,1.65].forEach((x,i)=>{
    const t=group("bedside"+(i+1),x,0,-3.6);
    box(0.5,0.5,0.5,0x8a6240,0,0.25,0,"bedsideBody",t);
    box(0.4,0.12,0.02,0x5d4129,0,0.35,0.26,"drawer",t);
  });
  const lamp=group("lamp",1.65,0.5,-3.6);
  box(0.15,0.2,0.15,0x444444,0,0.1,0,"lampBase",lamp);
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.18,0.25,16),new THREE.MeshStandardMaterial({color:0xfff1c1,emissive:0xffd98a,emissiveIntensity:0.6}));
  shade.position.y=0.32; shade.name="lampShade"; lamp.add(shade);
  const lp=new THREE.PointLight(0xffd9a0,0.6,4); lp.position.y=0.4; lamp.add(lp);

  // --- ตู้เสื้อผ้า (ผนังซ้าย) ---
  const wd=group("wardrobe",-h+0.4,0,-1.6,Math.PI/2);
  box(2.0,2.4,0.8,0xa0764a,0,1.2,0,"wardrobeBody",wd);
  box(0.97,2.3,0.03,0x8a6240,-0.5,1.2,0.41,"doorL",wd);
  box(0.97,2.3,0.03,0x8a6240,0.5,1.2,0.41,"doorR",wd);
  box(0.04,0.3,0.04,0xdddddd,-0.08,1.2,0.45,"handleL",wd);
  box(0.04,0.3,0.04,0xdddddd,0.08,1.2,0.45,"handleR",wd);

  // --- ชั้นวางของ/หนังสือ (ผนังซ้าย) ---
  const sh=group("shelf",-h+0.25,0,1.0,Math.PI/2);
  box(1.4,1.8,0.04,0x7a5a3a,0,0.9,-0.18,"shelfBack",sh);
  box(0.04,1.8,0.4,0x7a5a3a,-0.68,0.9,0,"shelfSideL",sh);
  box(0.04,1.8,0.4,0x7a5a3a,0.68,0.9,0,"shelfSideR",sh);
  const bc=[0xc0392b,0x2980b9,0x27ae60,0xf1c40f,0x8e44ad,0xe67e22];
  [0.02,0.6,1.2,1.78].forEach((y,i)=>{
    box(1.4,0.04,0.4,0x7a5a3a,0,y,0,"shelfBoard",sh);
    if(i<3) for(let k=0;k<6;k++) box(0.1,0.3+0.05*(k%3),0.22,bc[(k+i)%6],-0.5+k*0.15,y+0.17+0.025*(k%3),0,"book",sh);
  });

  // --- โต๊ะคอม (ผนังขวา หันเข้าห้อง) ---
  const dk=group("desk",h-0.45,0,1.6,-Math.PI/2);
  box(2.0,0.05,0.8,0xd9c3a0,0,0.75,0,"deskTop",dk);
  [[-0.95,-0.35],[0.95,-0.35],[-0.95,0.35],[0.95,0.35]].forEach(p=>box(0.05,0.75,0.05,0x555555,p[0],0.375,p[1],"deskLeg",dk));
  box(0.2,0.04,0.15,0x222222,0,0.79,-0.2,"monitorBase",dk);
  box(0.05,0.2,0.05,0x222222,0,0.9,-0.2,"monitorNeck",dk);
  box(0.95,0.55,0.04,0x111111,0,1.2,-0.22,"monitorBody",dk);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(0.87,0.47),(()=>{const t=drawScreen();return new THREE.MeshStandardMaterial({map:t,emissive:0xffffff,emissiveMap:t,emissiveIntensity:0.7});})());
  scr.position.set(0,1.2,-0.197); scr.name="monitorScreen"; dk.add(scr);
  box(0.5,0.02,0.16,0x2b2b2b,0,0.78,0.15,"keyboard",dk);
  box(0.07,0.025,0.11,0x2b2b2b,0.45,0.78,0.15,"mouse",dk);
  box(0.22,0.45,0.45,0x2a2a2a,0.75,1.0,-0.1,"pcTower",dk);
  box(0.02,0.02,0.02,0x00ff88,0.75,1.1,0.13,"pcLed",dk);
  // กรอบรูปเล็กบนโต๊ะ
  const pf=group("photoFrame",0,0,0); dk.add(pf); pf.position.set(-0.75,0.92,-0.15); pf.rotation.x=-0.15;
  const fr=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.32,0.02),mat(0x2b2b2b)); fr.name="photoFrameBorder"; fr.castShadow=true; pf.add(fr);
  photoMesh=new THREE.Mesh(new THREE.PlaneGeometry(0.21,0.28),new THREE.MeshStandardMaterial({color:0xffffff}));
  photoMesh.position.z=0.011; photoMesh.name="photoImage"; pf.add(photoMesh);

  // --- เก้าอี้ ---
  const ch=group("chair",h-1.3,0,1.6,-Math.PI/2-0.3);
  box(0.5,0.06,0.5,0x333333,0,0.5,0,"chairSeat",ch);
  box(0.5,0.6,0.06,0x333333,0,0.85,0.25,"chairBack",ch);
  box(0.06,0.5,0.06,0x777777,0,0.25,0,"chairPole",ch);
  box(0.5,0.04,0.06,0x777777,0,0.03,0,"chairBase1",ch);
  box(0.06,0.04,0.5,0x777777,0,0.03,0,"chairBase2",ch);

  // --- พรม / หน้าต่าง / ประตู ---
  const rug=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.02,32),mat(0x8e5a6a)); rug.position.set(0,0.01,0.3); rug.name="rug"; rug.receiveShadow=true; root.add(rug);
  const win=group("window",h-0.03,1.8,-1.6,-Math.PI/2);
  box(1.4,1.2,0.05,0xffffff,0,0,0,"windowFrame",win);
  const glass=new THREE.Mesh(new THREE.PlaneGeometry(1.25,1.05),new THREE.MeshStandardMaterial({color:0x9fd3ff,emissive:0x9fd3ff,emissiveIntensity:0.7}));
  glass.position.z=0.03; glass.name="windowGlass"; win.add(glass);
  box(0.03,1.05,0.02,0xffffff,0,0,0.04,"windowBarV",win);
  box(1.25,0.03,0.02,0xffffff,0,0,0.04,"windowBarH",win);
  const dr=group("door",-h+0.03,1.05,2.6,Math.PI/2);
  box(1.0,2.1,0.05,0x6e4b2a,0,0,0,"doorBody",dr);
  box(0.06,0.06,0.1,0xcccccc,0.38,0,0.05,"doorKnob",dr);

  // --- ตุ๊กตาหมี (Cel shading) บนเตียง ---
  const teddy=group("teddy",0.5,0.73,-2.9);
  const part=(r,c,x,y,z,n)=>{ const t=toonMesh(new THREE.SphereGeometry(r,24,16),c,n); t.position.set(x,y,z); teddy.add(t); };
  part(0.17,0xb5793f,0,0.17,0,"teddyBody");
  part(0.12,0xb5793f,0,0.42,0.02,"teddyHead");
  part(0.05,0xb5793f,-0.09,0.52,0.02,"teddyEarL");
  part(0.05,0xb5793f,0.09,0.52,0.02,"teddyEarR");
  part(0.05,0xe8c9a0,0,0.4,0.12,"teddySnout");
  teddy.rotation.y=0.4;

  // --- ม่านหน้าต่าง (Vertex Shader แกว่งแบบ realtime) ---
  const curtainMat=new THREE.ShaderMaterial({
    side:THREE.DoubleSide, uniforms:{uTime:uTime,uHL:{value:0}},
    vertexShader:`uniform float uTime;varying float vD;varying vec2 vUv;
      void main(){vUv=uv;vec3 p=position;float k=1.-uv.y;
        float w=sin(p.x*8.+p.y*2.+uTime*1.5)*0.06*k+sin(p.x*22.)*0.025;
        p.z+=w;vD=w;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader:`uniform float uHL;varying float vD;varying vec2 vUv;
      void main(){float s=0.8+vD*3.;gl_FragColor=vec4(vec3(0.85,0.45,0.5)*s+uHL*vec3(0.25,0.25,0.1),1.);}`});
  [-0.8,0.8].forEach((x,i)=>{
    const c=new THREE.Mesh(new THREE.PlaneGeometry(0.55,2.0,24,30),curtainMat);
    c.position.set(x,0.1,0.12); c.name="curtain"+(i+1); win.add(c);
  });

  return root;
}
// ======================= Demo scene =======================
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1b1d22);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);

const sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(5,6,6); sun.castShadow=true;
sun.shadow.camera.left=sun.shadow.camera.bottom=-6; sun.shadow.camera.right=sun.shadow.camera.top=6; sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
const ceil=new THREE.PointLight(0xfff0d8,0.5,10); ceil.position.set(0,2.7,0); scene.add(ceil);

// orbit แบบง่าย
let theta=0.6,phi=1.1,dist=11; const target=new THREE.Vector3(0,1,0);
// ===== กรอบ portfolio บนจอคอม: ใส่เนื้อหาแต่ละหน้าที่ PAGES (body ใส่ HTML ได้) =====
const PAGES=[
  {title:"Contract",body:"<p>เบอร์โทร : 0613895978</p><p>Mail : Nattaphat.J@ku.th</p>"},
  {title:"Skills",body:"<p>C, JavaScript, Three.js, WebGL, HTML, SQL, Python</p>"},
  {title:"Projects",body:"<p>Paint Application</p><p>Modeling Material</p>"}
];
const panel=document.getElementById("panel"), pTitle=document.getElementById("panelTitle"), pBody=document.getElementById("panelBody"),
  pNo=document.getElementById("pageNo"), prevBtn=document.getElementById("prevBtn"), nextBtn=document.getElementById("nextBtn");
let page=0;
function renderPage(){
  pTitle.textContent=PAGES[page].title; pBody.innerHTML=PAGES[page].body;
  pNo.textContent=(page+1)+" / "+PAGES.length; prevBtn.disabled=page===0; nextBtn.disabled=page===PAGES.length-1;
}
prevBtn.onclick=()=>{ if(page>0){page--;renderPage();} };
nextBtn.onclick=()=>{ if(page<PAGES.length-1){page++;renderPage();} };
renderPage();
const dPos=new THREE.Vector3(), dLook=target.clone(), lookNow=target.clone();
function cam(){ panel.classList.remove("show"); dLook.copy(target); dPos.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta)); }
cam(); camera.position.copy(dPos);
// ซูมกล้องไปที่วัตถุที่คลิก (กรอบรูป / กรอบข้อความ / จอคอม)
const FOCUS={photoImage:["photoImage",0.8],photoFrameBorder:["photoImage",0.8],nameText:["nameText",3.4],nameFrameBorder:["nameText",3.4],monitorScreen:["monitorScreen",1.3],monitorBody:["monitorScreen",1.3]};
function focusOn(name){
  const f=FOCUS[name]; if(!f){ cam(); return; }   // คลิกที่อื่น = กลับมุมมองเดิม
  const m=scene.getObjectByName(f[0]), p=new THREE.Vector3(), n=new THREE.Vector3();
  m.getWorldPosition(p); m.getWorldDirection(n);
  dLook.copy(p); dPos.copy(p).addScaledVector(n,f[1]);
  panel.classList.toggle("show",f[0]==="monitorScreen");   // แสดงกรอบดำเฉพาะตอนซูมจอคอม
}
let drag=false,moved=0,lx=0,ly=0; const el=renderer.domElement;
el.addEventListener("pointerdown",e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;});
addEventListener("pointerup",e=>{ if(drag&&moved<5) pick(e); drag=false; });
addEventListener("pointermove",e=>{ if(!drag)return; const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX;ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  theta-=dx*0.006; phi=Math.min(1.5,Math.max(0.2,phi-dy*0.006)); cam(); });
el.addEventListener("wheel",e=>{ e.preventDefault(); dist=Math.min(16,Math.max(3,dist+e.deltaY*0.01)); cam(); },{passive:false});

// Picking
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); const info=document.getElementById("info");
function pick(e){
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(scene.children,true)[0];
  sel=hit?hit.object:null;
  focusOn(sel?sel.name:"");
  info.textContent="ลากเพื่อหมุน • scroll เพื่อซูม • คลิกที่อื่นเพื่อกลับ • คลิกวัตถุ: "+(sel?sel.name:"-");
}
let sel=null;

addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
(function loop(t){ requestAnimationFrame(loop); uTime.value=(t||0)/1000;
  camera.position.lerp(dPos,0.08); lookNow.lerp(dLook,0.08); camera.lookAt(lookNow);
  renderer.render(scene,camera); })();
